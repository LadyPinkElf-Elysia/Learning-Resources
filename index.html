<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 学习资料</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 20px; background: #f8fafc; }
        h1 { font-weight: 600; font-size: 1.8rem; margin-bottom: 0; }
        .sub { color: #64748b; margin-top: 4px; }
        hr { border: none; border-top: 2px solid #e2e8f0; margin: 20px 0; }
        ul { list-style: none; padding-left: 24px; }
        li { margin: 4px 0; }
        .folder { cursor: pointer; font-weight: 500; color: #0f172a; padding: 4px 8px; border-radius: 6px; display: inline-block; }
        .folder:hover { background: #e2e8f0; }
        .file a { color: #2563eb; text-decoration: none; padding: 4px 8px; border-radius: 6px; display: inline-block; }
        .file a:hover { background: #dbeafe; }
        .hidden { display: none; }
        .footer { margin-top: 30px; color: #94a3b8; font-size: 0.85rem; }
        .footer a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>

    <h1>📚 学习资料库</h1>
    <p class="sub">点击 📁 文件夹展开 / 收起</p>
    <hr>

    <div id="tree-container"></div>

    <hr>
    <div class="footer">
        <a href="https://github.com/ladypinkelf-elysia/Learning-Resources" target="_blank">GitHub 仓库</a>
    </div>

    <script>
        // ============================================================
        // 📂 树形数据：目录用对象 {}，文件用数组 []
        // 新增文件时，只需要在对应目录的数组里加一个文件名即可
        // 目录名支持任意嵌套，结构一目了然
        // ============================================================
        const tree = {
            "数学": {
                "初等数学": {
                    "立体几何": [
                        "立体几何.html"
                    ]
                },
                "高等数学": {
                    "微分方程": [
                        "化归.html"
                    ]
                }
            }
        };

        // ============================================================
        // 以下为渲染引擎，无需改动
        // ============================================================

        /**
         * 递归渲染树形结构
         * @param {object|array} node  当前节点（对象=目录，数组=文件列表）
         * @param {string}       path  当前路径前缀（用于拼接文件链接）
         * @param {HTMLElement}  container  挂载点
         */
        function renderTree(node, path, container) {
            const ul = document.createElement('ul');

            // 如果当前节点是数组 => 文件列表
            if (Array.isArray(node)) {
                node.sort().forEach(filename => {
                    const li = document.createElement('li');
                    li.className = 'file';
                    const a = document.createElement('a');
                    // 拼接完整路径：path + "/" + filename
                    a.href = path + '/' + filename;
                    a.target = '_blank';
                    a.textContent = '📄 ' + filename;
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                container.appendChild(ul);
                return;
            }

            // 当前节点是对象 => 目录（可能有子目录，也可能有 _files 文件列表）
            const keys = Object.keys(node).sort();

            // 先处理子目录（非 _files 的键）
            keys.forEach(key => {
                if (key === '_files') return; // 文件列表单独处理
                const value = node[key];
                const li = document.createElement('li');
                const span = document.createElement('span');
                span.className = 'folder';
                span.textContent = '📁 ' + key;
                li.appendChild(span);

                const childDiv = document.createElement('div');
                childDiv.className = 'hidden'; // 默认折叠
                const newPath = path + '/' + key;
                renderTree(value, newPath, childDiv);
                li.appendChild(childDiv);

                span.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const target = this.nextElementSibling;
                    target.classList.toggle('hidden');
                });

                ul.appendChild(li);
            });

            // 再处理当前目录下的文件（如果有 _files）
            if (node._files && Array.isArray(node._files)) {
                node._files.sort().forEach(filename => {
                    const li = document.createElement('li');
                    li.className = 'file';
                    const a = document.createElement('a');
                    a.href = path + '/' + filename;
                    a.target = '_blank';
                    a.textContent = '📄 ' + filename;
                    li.appendChild(a);
                    ul.appendChild(li);
                });
            }

            container.appendChild(ul);
        }

        // 启动渲染：从根路径 "" 开始
        renderTree(tree, '', document.getElementById('tree-container'));
    </script>

</body>
</html>
